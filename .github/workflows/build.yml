name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve web symlink
        run: |
          rm -f ArkDock/Sources/web
          cp -R web ArkDock/Sources/web

      - name: Build
        run: cd ArkDock && swift build -c release

      - name: Package
        run: |
          mkdir -p dist
          cp ArkDock/.build/release/ArkDock dist/
          cd dist && zip ArkDock-macOS.zip ArkDock

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArkDock-macOS
          path: dist/ArkDock-macOS.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ArkDock-macOS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ArkDock-macOS.zip
          generate_release_notes: true
