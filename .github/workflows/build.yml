name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cd ArkDock && swift build -c release

      - name: Package app
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_PATH="ArkDock/.build/release/ArkDock"
          mkdir -p dist
          cp "$APP_PATH" dist/
          cd dist && zip ArkDock-macOS.zip ArkDock

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ArkDock-macOS
          path: dist/ArkDock-macOS.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ArkDock-macOS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ArkDock-macOS.zip
          generate_release_notes: true
