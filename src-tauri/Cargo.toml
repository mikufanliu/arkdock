[package]
name = "arkdock"
version = "0.3.4"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "macos-private-api", "image-png"] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.19", features = ["wav", "mp3", "vorbis", "flac"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
